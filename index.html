<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的知識隨身聽</title>
<style>body{margin:0;background:#f5f6f8;color:#26384c;font-family:system-ui,'Microsoft JhengHei',sans-serif}header{background:#243d58;color:white;text-align:center;padding:35px 12px}main{max-width:800px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card,.article,.player{background:white;border:0;border-radius:17px;padding:22px;margin-bottom:14px;box-shadow:0 4px 20px #0001}.card{text-align:left;cursor:pointer;color:inherit}.card h2{margin:0 0 8px}.card p,.article p{line-height:1.8}.hidden{display:none}button,select{font:inherit}button{cursor:pointer}.btn{background:#243d58;color:white;border:0;border-radius:10px;padding:10px 15px;margin:4px}.btn:disabled{opacity:.4}.alt{background:#e4ebf2;color:#243d58}.active{background:#087d84}.article p{white-space:pre-line}.player{position:sticky;bottom:8px;border:1px solid #ccd9e5}.note{color:#637488;font-size:14px;line-height:1.7}a{margin:8px;color:#175c9b}footer{text-align:center;padding:20px;color:#7b8795}
#backTop{position:fixed;right:18px;bottom:20px;z-index:30;border:0;border-radius:50%;width:52px;height:52px;background:#243d58;color:white;font-size:26px;box-shadow:0 5px 18px #0004;display:none;cursor:pointer}
#backTop.visible{display:block}
#backTop:focus-visible{outline:3px solid #2ca5b2;outline-offset:3px}
@media(max-width:600px){#backTop{right:12px;bottom:12px}body:has(#player:not(.hidden)) #backTop{bottom:165px}}</style>
<header><h1>🎧 我的知識隨身聽</h1><p>投資・健康・知識精華・花蓮地方新聞｜摘要與詳細解說朗讀</p></header><main>
<div id="home" class="grid"><button class="card" onclick="show('invest')"><h2>📈 投資理財</h2><p>理財知識與市場新聞</p></button><button class="card" onclick="show('health')"><h2>💚 健康醫療</h2><p>醫療新知與健康資訊</p></button><button class="card" onclick="show('knowledge')"><h2>📚 知識精華</h2><p>每天學習一點新知</p></button><button class="card" onclick="show('hualien',true)"><h2>📍 花蓮地方新聞</h2><p>在地消息與新聞摘要</p></button><button class="card" onclick="show('audio')"><h2>🎙️ 精華說書</h2><p>集中聆聽所有文章</p></button></div>
<div id="detail" class="hidden"><button class="btn alt" onclick="home()">← 返回首頁</button><h2 id="heading"></h2><p>朗讀模式：<button class="btn" id="sbtn" onclick="setMode('summary')">摘要</button><button class="btn" id="fbtn" onclick="setMode('full')">詳細解說</button></p><div id="articles"></div></div>
<div id="player" class="player hidden"><strong id="playing"></strong><p id="status" class="note">準備朗讀</p><button class="btn" id="pause" onclick="pauseResume()">⏸ 暫停</button><button class="btn alt" onclick="stop()">■ 停止</button><button class="btn alt" onclick="next()">⏭ 下一篇</button><label>語速 <select id="rate" onchange="restart()"><option value="0.8">0.8倍</option><option value="1">1倍</option><option value="1.25" selected>1.25倍</option><option value="1.5">1.5倍</option></select></label><label>聲音 <select id="voice" onchange="voiceChanged()" aria-label="選擇朗讀聲音"><option value="">自動選擇溫柔男聲（依裝置支援）</option></select></label><label><input id="continuous" type="checkbox" checked>連續播放</label></div></main><button id="backTop" title="回到最上方" aria-label="回到最上方" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button><footer>© 2026 我的知識隨身聽</footer>
<script>
const examples=[['invest','認識分散投資','分散投資可以降低單一資產的風險，但無法保證獲利。','分散投資是把資金配置在不同資產，降低單一標的波動對整體投資組合的影響。分散不保證獲利，也不能完全避免市場下跌。投資前仍需評估風險承受能力、費用與資金使用期限。'],['invest','什麼是安全邊際？','買入價格與估計合理價值之間保留一定空間。','安全邊際是估計資產合理價值後，保留一定折價空間再考慮買進的概念。合理價值屬於估計，可能出錯；價格便宜不代表一定會上漲。'],['health','睡眠與健康','規律作息與舒適睡眠環境有助健康。','規律的作息、舒適的睡眠環境與適度運動，有助維持良好睡眠。若長期失眠、嚴重打鼾或白天嗜睡，建議向醫療專業人員諮詢。'],['health','認識血壓紀錄','持續記錄血壓比只看一次量測更有參考價值。','量測血壓前先安靜休息，依照醫療人員建議採取正確姿勢與量測方式。記錄日期、時間和數值，比只看單次結果更有助於討論血壓變化。'],['knowledge','如何有效學習？','拆解目標，透過重述與間隔複習加深記憶。','把大目標拆成小段，每次聚焦一個主題。學完後試著用自己的話重述，再隔一段時間複習，通常比一次讀很久更容易建立長期記憶。'],['knowledge','建立每日閱讀習慣','每天固定閱讀五分鐘並記錄重點。','每天選擇一個固定時段，先從五分鐘開始。記下最重要的一個觀念，並想想今天能如何應用。']].map(([category,title,summary,content])=>({category,title,summary,content}));
const investmentGuide={
  category:'invest',
  title:'0050 和 0052 有什麼差別？',
  source:'投資解說',
  summary:'0050 追蹤台灣大型上市公司，0052 聚焦台灣資訊科技股。兩檔一起買時，要看主要持股重疊多少，以及科技股在整體資產裡占多少。',
  content:`先看兩檔基金怎麼選股。0050 是元大台灣50，追蹤臺灣50指數。指數從符合條件的台灣上市公司裡挑出市值最大的五十家，涵蓋科技、金融等產業。市值大的公司通常權重較高，所以即使有五十家公司，科技股仍可能占很大比重。

0052 是富邦科技，追蹤臺灣資訊科技指數。它把範圍集中在台灣資訊科技產業。科技景氣走強時，這種集中配置可能受惠。碰上半導體景氣轉弱或大型科技股下跌時，波動也可能更明顯。

兩檔一起持有時，可以把同一家公司的權重加總。假設同一家公司在第一檔占百分之六十，在第二檔占百分之七十，而且你各投入一半資金，那麼這家公司在兩檔合計的部位裡約占百分之六十五。這是算式示範，實際比重以基金公布的持股為準。

想比較兩檔，可以先看最新的前十大持股和產業比重，再看年度費用、含息報酬和下跌時的幅度。每股價格會受基金分割等因素影響。要比較長期表現，用同一段期間的含息報酬，比直接比較每股價格更有意義。`,
  references:[
    {url:'https://www.yuantaetfs.com/product/detail/0050/Basic_information',label:'0050 元大投信'},
    {url:'https://www.twse.com.tw/zh/ETFortune/etfInfo/0052',label:'0052 臺灣證券交易所'}
  ]
};
let data=[investmentGuide,...examples],visible=[],section='invest',mode=localStorage.getItem('listen-mode')||'summary',index=-1,token=0,paused=false;
const el=id=>document.getElementById(id),str=x=>typeof x==='string'?x.trim():'';
function cat(x){x=String(x||'').toLowerCase();if(x==='hualien')return 'hualien';return /invest|finance|market|business|投資|理財|財經|金融|股市|經濟/.test(x)?'invest':/health|medical|medicine|健康|醫療|醫藥|衛生/.test(x)?'health':'knowledge'}
function parse(x){
 if(Array.isArray(x))return x;
 if(!x||typeof x!=='object')return [];
 if(x.sections&&typeof x.sections==='object')return Object.entries(x.sections).flatMap(([category,items])=>Array.isArray(items)?items.map(a=>({...a,category})):[]);
 for(const k of ['articles','items','news','entries','data','results'])if(x[k]){const a=parse(x[k]);if(a.length)return a}
 return Object.entries(x).flatMap(([category,items])=>Array.isArray(items)?items.map(a=>({...a,category:a.category||category})):[])
}
function norm(a){if(!a||typeof a!=='object')return null;let title=str(a.title||a.headline||a.name);if(!title)return null;return {title,category:cat(a.category||a.type||a.topic||a.section),summary:str(a.summary||a.description||a.excerpt||a.digest),content:str(a.explanation),explanationUrl:str(a.explanation_url),url:str(a.url||a.link||a.source_url),source:str(a.source||a.publisher),date:str(a.date||a.published||a.pubDate)}}
async function load(){try{let r=await fetch('./articles.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;let a=parse(await r.json()).map(norm).filter(Boolean);if(a.length){data=[investmentGuide,...a];if(!el('detail').classList.contains('hidden'))show(section)}}catch(e){console.info('使用內建示範文章',e)}}
function stop(){token++;if('speechSynthesis'in window)speechSynthesis.cancel();index=-1;paused=false;el('player').classList.add('hidden');el('pause').textContent='⏸ 暫停'}
function show(k,openSummary=false){stop();if(openSummary)mode='summary';section=k;visible=k==='audio'?[...data]:data.filter(a=>a.category===k);el('home').classList.add('hidden');el('detail').classList.remove('hidden');el('heading').textContent=({invest:'📈 投資理財',health:'💚 健康醫療',knowledge:'📚 知識精華',hualien:'📍 花蓮地方新聞',audio:'🎙️ 精華說書'})[k];render();scrollTo(0,0)}
function home(){stop();el('detail').classList.add('hidden');el('home').classList.remove('hidden')}
function setMode(m){mode=m;localStorage.setItem('listen-mode',m);stop();render()}
function comparableText(text){
  return text.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
}
function summary(article){
  if(article.category==='hualien'){
    const title=comparableText(article.title);
    const body=comparableText(article.summary);
    const headline=comparableText(article.title.split(/\s+[-–—｜|]\s+/)[0]);
    if(!body||body===title||body===headline||article.summary==='請點選原文連結閱讀完整報導。')return '';
  }
  return article.summary||article.content.slice(0,180)+(article.content.length>180?'……':'')||'尚無摘要';
}
function render(){
  const detailed=mode==='full';
  el('sbtn').classList.toggle('active',!detailed);
  el('fbtn').classList.toggle('active',detailed);
  const holder=el('articles');
  holder.replaceChildren();
  visible.forEach((article,index)=>{
    if(detailed&&!article.content)return;
    const card=document.createElement('article');
    card.className='article';
    const title=document.createElement('h3');
    title.textContent=article.title;
    const body=detailed?article.content:summary(article);
    const meta=document.createElement('div');
    meta.className='note';
    meta.textContent=[article.source,article.date].filter(Boolean).join(' · ');
    const button=document.createElement('button');
    button.className='btn';
    button.textContent=detailed?'▶ 詳細解說朗讀':body?'▶ 摘要朗讀':'▶ 標題朗讀';
    button.onclick=()=>play(index);
    card.append(title,meta);
    if(body){
      const paragraph=document.createElement('p');
      paragraph.textContent=body;
      card.append(paragraph);
    }
    card.append(button);
    appendArticleLink(card,article.url,'閱讀原文');
    if(detailed){
      appendArticleLink(card,article.explanationUrl,'解說來源');
      for(const reference of article.references??[])appendArticleLink(card,reference.url,reference.label);
    }
    holder.append(card);
  });
  if(!holder.childElementCount){
    holder.textContent=detailed?'這個分類目前沒有詳細解說。可切回摘要瀏覽新聞。':'目前沒有文章';
  }
}
function appendArticleLink(card,url,label){
  if(!/^https?:\/\//i.test(url))return;
  const link=document.createElement('a');
  link.href=url;
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent=label;
  card.append(link);
}
function availableVoices(){return 'speechSynthesis' in window?speechSynthesis.getVoices():[]}
function isChineseVoice(v){return /^zh(?:-|_)/i.test(v.lang)||/chinese|mandarin|中文|國語/i.test(v.name)}
function maleScore(v){
 const n=v.name.toLowerCase();
 // Voice names are only hints: browsers do not expose reliable gender/tone metadata.
 let score=0;
 if(/zh[-_]tw/i.test(v.lang))score+=30;
 else if(/zh[-_]hk/i.test(v.lang))score+=18;
 else if(/^zh/i.test(v.lang))score+=12;
 if(/yunxi|yunjian|yunyang|yunfeng|yunhao|yunze|yunxia|yunyi|yunlong|yunfan|yunpeng|yunxiao|男聲|male/i.test(n))score+=100;
 if(/xiaoxiao|xiaoyi|hsiao|female|女聲/i.test(n))score-=60;
 if(/natural|neural|online/i.test(n))score+=5;
 return score;
}
function refreshVoices(){
 const selector=el('voice'),previous=localStorage.getItem('listen-voice')||selector.value;
 const voices=availableVoices().filter(isChineseVoice);
 selector.replaceChildren();
 const auto=document.createElement('option');auto.value='';auto.textContent='自動選擇溫柔男聲（依裝置支援）';selector.append(auto);
 voices.forEach(v=>{const option=document.createElement('option');option.value=v.voiceURI;option.textContent=v.name+'（'+v.lang+'）';selector.append(option)});
 selector.value=voices.some(v=>v.voiceURI===previous)?previous:'';
}
function voiceChanged(){localStorage.setItem('listen-voice',el('voice').value);restart()}
function chosenVoice(){
 const voices=availableVoices().filter(isChineseVoice);
 const selected=el('voice').value;
 if(selected){const voice=voices.find(v=>v.voiceURI===selected);if(voice)return voice}
 return [...voices].sort((a,b)=>maleScore(b)-maleScore(a))[0]||null;
}
function play(i){if(!('speechSynthesis'in window)){alert('瀏覽器不支援朗讀，請改用 Chrome 或 Edge');return}let a=visible[i];if(!a)return;let text=mode==='full'?a.content:summary(a);if(mode==='full'&&!text)return;stop();index=i;let t=token,u=new SpeechSynthesisUtterance(text?a.title+'。'+text:a.title);u.lang='zh-TW';u.rate=Number(el('rate').value);u.voice=chosenVoice();u.onstart=()=>{if(t===token)el('status').textContent='朗讀中'};u.onend=()=>{if(t===token){if(el('continuous').checked)next();else stop()}};u.onerror=e=>{if(t===token&&!['canceled','interrupted'].includes(e.error))el('status').textContent='朗讀中斷，請重試'};el('playing').textContent=a.title;el('status').textContent='準備語音……';el('player').classList.remove('hidden');speechSynthesis.speak(u)}
function pauseResume(){if(index<0)return;if(paused){speechSynthesis.resume();el('pause').textContent='⏸ 暫停';el('status').textContent='朗讀中'}else{speechSynthesis.pause();el('pause').textContent='▶ 繼續';el('status').textContent='已暫停'}paused=!paused}
function next(){let n=index+1;while(n<visible.length&&mode==='full'&&!visible[n].content)n++;n<visible.length?play(n):stop()}
function restart(){if(index>=0)play(index)}
window.addEventListener('pagehide',stop);
window.addEventListener('scroll',()=>el('backTop').classList.toggle('visible',window.scrollY>350),{passive:true});
if('speechSynthesis' in window){refreshVoices();speechSynthesis.addEventListener('voiceschanged',refreshVoices)}
el('rate').value=localStorage.getItem('listen-rate')||'1.25';
el('rate').addEventListener('change',()=>localStorage.setItem('listen-rate',el('rate').value));
render();load();
</script></html>
